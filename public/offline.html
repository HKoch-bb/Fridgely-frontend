<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fridgely — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0d0f0a 0%, #141210 50%, #1a1e14 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      padding: 24px;
    }
    .card {
      max-width: 380px; width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      backdrop-filter: blur(20px);
    }
    .logo {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(145deg, #4a7a3a, #5a7c4a);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 28px rgba(107,140,90,0.45);
      font-size: 32px;
    }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
    p { color: rgba(255,255,255,0.45); font-size: 0.9rem; line-height: 1.7; margin-bottom: 32px; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #5a7c4a, #4a6a3a);
      color: #fff; font-weight: 700; font-size: 0.95rem;
      padding: 14px 32px; border-radius: 12px;
      text-decoration: none; cursor: pointer;
      border: none;
      box-shadow: 0 6px 20px rgba(107,140,90,0.4);
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .tip {
      margin-top: 24px;
      color: rgba(255,255,255,0.2);
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🧊</div>
    <h1>You're offline</h1>
    <p>Fridgely needs a connection to generate recipes and sync your pantry. Your saved recipes are still available once you reconnect.</p>
    <button class="btn" onclick="window.location.reload()">Try again →</button>
    <p class="tip">Your pantry and saved recipes will sync automatically when you're back online.</p>
  </div>
</body>
</html>
